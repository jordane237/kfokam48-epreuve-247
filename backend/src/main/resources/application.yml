spring:
  application:
    name: kfokam48-presence
  datasource:
    url: jdbc:h2:mem:presence;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

server:
  port: 8080
