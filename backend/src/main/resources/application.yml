spring:
  application:
    name: kfokam48-presence
  datasource:
    url: jdbc:h2:mem:presence;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jackson:
    deserialization:
      # RG8 : une note doit être un entier — 12.5 est rejeté (400 NOTE_INVALIDE),
      # au lieu d'être tronqué silencieusement en 12 par Jackson.
      accept-float-as-int: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

server:
  port: 8080
